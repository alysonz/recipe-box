<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Recipe Box</title><style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap');
:root{--blue:#244b78;--blue2:#577ba3;--ink:#1d3048;--muted:#718096;--paper:#f2f6fa;--line:#d7e1ec;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px 'DM Sans',sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer}.page{max-width:1120px;margin:0 auto;padding:48px 36px 36px}.masthead{text-align:center;padding:3px 0 26px}.fleur{display:block;width:29px;height:34px;margin:0 auto 5px;color:var(--blue2)}.masthead h1{font:600 48px/1 'Cormorant Garamond',serif;letter-spacing:.4px;color:var(--blue);margin:0}.ornament{display:flex;align-items:center;gap:12px;width:126px;margin:13px auto 0;color:var(--blue2)}.ornament:before,.ornament:after{content:'';height:1px;background:var(--blue2);opacity:.55;flex:1}.ornament span{font-size:9px}.toolbar{margin:25px auto 15px;max-width:620px}.search{position:relative}.search:before{content:'⌕';position:absolute;left:15px;top:7px;font-size:23px;color:var(--blue2)}.search input{width:100%;height:46px;padding:0 16px 0 43px;border:1px solid #c7d5e4;border-radius:4px;background:var(--white);color:var(--ink);outline:none;box-shadow:0 2px 10px #244b7808}.search input:focus{border-color:var(--blue2);box-shadow:0 0 0 3px #577ba31a}.table-wrap{background:var(--white);border:1px solid #cbd8e5;overflow:auto;box-shadow:0 8px 25px #244b7809}.table{width:100%;border-collapse:collapse;min-width:620px}.table th{text-align:left;padding:13px 20px;background:var(--blue);color:white;font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase}.table td{padding:15px 20px;border-bottom:1px solid #e8eef4;vertical-align:middle}.table tbody tr:last-child td{border-bottom:0}.table tbody tr:hover{background:#f4f8fc}.recipe-row{cursor:pointer}.recipe-row:focus{outline:2px solid var(--blue2);outline-offset:-2px}.table th:nth-child(2),.table td:nth-child(2),.table th:nth-child(3),.table td:nth-child(3){width:105px}.table th:last-child,.table td:last-child{text-align:right;min-width:142px}.name{font:600 21px/1.1 'Cormorant Garamond',serif;color:var(--blue)}.sub{display:block;color:var(--muted);font-size:11px;line-height:1.45;margin-top:5px;max-width:620px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.record-meta{white-space:normal;overflow:visible;text-overflow:clip;max-width:none;line-height:1.5;color:#657c96}.data{font-size:12px;color:#53677e}.open{border:0;background:transparent;padding:6px 0 6px 10px;color:var(--blue);font-weight:600;font-size:12px}.open:hover{color:#7392b5}.share{border:1px solid #d2deea;background:white;color:var(--blue);font-size:11px;padding:6px 9px;border-radius:3px;margin-left:5px}.share:hover{background:#edf3f9}.pager{display:flex;justify-content:space-between;align-items:center;color:var(--muted);padding:13px 2px;font-size:11px}.pagebtn{border:1px solid #cbd8e5;background:white;color:var(--blue);padding:7px 12px;margin-left:5px;border-radius:3px}.pagebtn:disabled{opacity:.4;cursor:default}.empty{padding:45px;text-align:center;color:var(--muted);background:white;border:1px solid var(--line)}.overlay{position:fixed;inset:0;background:#10243bcc;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.overlay.open{display:flex}.modal{background:#fff;width:min(760px,100%);max-height:90vh;overflow:auto;border:1px solid #b9cadc;box-shadow:0 25px 70px #10243b55}.modal-head{padding:20px 26px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:2}.modal-head h2{font:600 30px/1 'Cormorant Garamond',serif;color:var(--blue);margin:0}.iconbtn{border:0;background:transparent;color:var(--blue2);font-size:20px;padding:2px 5px}.modal-body{padding:20px 26px 28px}.detail-meta{color:var(--blue2);font-size:12px;line-height:1.8;padding:0 0 15px;margin:0 0 18px;border-bottom:1px solid #e9eff5}.nutrition{border-top:1px solid #e9eff5;padding-top:17px}.nutrition dl{display:flex;flex-wrap:wrap;gap:9px 20px;margin:0}.nutrition dl div{display:flex;gap:6px;font-size:12px}.nutrition dt{color:var(--muted)}.nutrition dd{margin:0;color:var(--blue);font-weight:600}.source-credit{font-size:13px;line-height:1.65;color:#344b65}.source-credit a{color:var(--blue);text-underline-offset:3px}.tags{display:flex;flex-wrap:wrap;gap:7px;margin:0;padding:0;list-style:none}.tags li{border:1px solid #d5e0eb;padding:5px 9px;color:#46617e;font-size:11px;background:#f8fbfe}.share-panel{position:fixed;right:24px;bottom:24px;width:min(440px,calc(100vw - 32px));padding:16px;background:white;border:1px solid #b9cadc;box-shadow:0 12px 38px #10243b2b;z-index:8}.share-panel[hidden]{display:none}.share-heading{display:flex;justify-content:space-between;align-items:center;color:var(--blue);font:600 20px 'Cormorant Garamond',serif;margin-bottom:10px}.share-close{border:0;background:transparent;color:var(--blue2);font-size:19px}.share-controls{display:flex;gap:7px}.share-controls input{width:100%;min-width:0;border:1px solid #c7d5e4;padding:9px 10px;color:#53677e;font-size:11px}.copy-state{display:block;min-height:16px;margin-top:7px;color:var(--muted);font-size:11px}.detail-section{margin:0 0 22px}.detail-section:last-child{margin-bottom:0}.detail-section h3{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--blue2);margin:0 0 8px}.detail-section p{white-space:pre-wrap;line-height:1.7;margin:0;color:#344b65}.load-error{padding:35px;color:#8d3b3b;background:white;border:1px solid var(--line)}
@media(max-width:700px){.page{padding:30px 15px}.masthead{padding-bottom:20px}.masthead h1{font-size:42px}.toolbar{margin-top:18px}.table th,.table td{padding:12px}.name{font-size:19px}.sub{max-width:250px}.modal-head{padding:17px 19px}.modal-body{padding:17px 19px 24px}}@media(max-width:440px){.table{min-width:570px}.pager{align-items:flex-start;gap:10px;flex-direction:column}.page{padding-left:12px;padding-right:12px}}
</style></head><body><main class="page"><header class="masthead"><svg class="fleur" viewBox="0 0 40 48" aria-hidden="true"><path d="M20 3c-2 5-7 8-7 13 0 3 2 5 5 6-6-1-12 1-12 6 0 4 4 6 9 5-3 2-4 4-4 7 0 3 3 5 7 4l2-8 2 8c4 1 7-1 7-4 0-3-1-5-4-7 5 1 9-1 9-5 0-5-6-7-12-6 3-1 5-3 5-6 0-5-5-8-7-13z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M20 21v21M13 23c-4-3-6-7-6-11m20 11c4-3 6-7 6-11" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><h1>The Recipe Box</h1><div class="ornament"><span>✦</span></div></header><div class="toolbar"><div class="search"><input id="query" type="search" placeholder="Search recipes and ingredients…" aria-label="Search recipes and ingredients"></div></div><div id="listing"></div><div class="pager" id="pager"></div></main><div class="overlay" id="overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle"></h2><span><button class="share" id="modalShare">Share</button><button class="iconbtn" id="close" aria-label="Close">×</button></span></div><div class="modal-body" id="modalBody"></div></section></div><aside class="share-panel" id="sharePanel" hidden aria-label="Recipe share link"><div class="share-heading"><span>Recipe link</span><button class="share-close" id="shareClose" aria-label="Close">×</button></div><div class="share-controls"><input id="shareUrl" readonly aria-label="Shareable recipe link"><button class="share" id="copyLink">Copy</button></div><span class="copy-state" id="copyState">Link copied to clipboard.</span></aside><script>
const $=s=>document.querySelector(s);let recipes=[],page=1,perPage=30;
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function sourceLabel(r){const raw=(r.source||'').trim();if(!raw)return '';if(/^https?:\/\//i.test(raw)){try{const host=new URL(raw).hostname.replace(/^(www|m)\./i,'').toLowerCase(),names={'allrecipes.com':'Allrecipes','foodnetwork.com':'Food Network','bonappetit.com':'Bon Appétit','nytimes.com':'New York Times Cooking','marthastewart.com':'Martha Stewart','foodandwine.com':'Food & Wine','tasteofhome.com':'Taste of Home'};return 'Web · '+(names[host]||host)}catch{return 'Web'}}if(/^(?:uspca|uscpa|upsca) conference 2015$/i.test(raw))return 'USPCA Conference (2015)';return raw}
function recordMeta(r){const items=[];const source=sourceLabel(r),tags=String(r.tag_list||'').split(',').map(x=>x.trim()).filter(Boolean);if(source)items.push(`Source: ${source}`);if(tags.length)items.push(`Tags: ${tags.join(' · ')}`);return items.join('　|　')}
function showRows(){const q=$('#query').value.toLowerCase(),rows=recipes.filter(r=>['name','description','ingredients','directions','comments','source','tag_list'].some(k=>String(r[k]||'').toLowerCase().includes(q))),max=Math.max(1,Math.ceil(rows.length/perPage));page=Math.min(page,max);const part=rows.slice((page-1)*perPage,page*perPage);if(!part.length){$('#listing').innerHTML='<div class="empty">No recipes found. Try another search.</div>';$('#pager').innerHTML='';return}const body=part.map(r=>`<tr class="recipe-row" data-index="${r.recipeIndex}" tabindex="0"><td><div class="name">${safe(r.name||'Untitled recipe')}</div><span class="sub">${safe((r.description||r.ingredients||'').replace(/\s+/g,' '))}</span>${recordMeta(r)?`<span class="sub record-meta">${safe(recordMeta(r))}</span>`:''}</td><td class="data">${r.servings?safe(r.servings):'—'}</td><td class="data">${r.preparation_time||r.cook_time?safe(r.preparation_time||r.cook_time)+' min':'—'}</td><td><button class="open" data-view="${r.recipeIndex}">View</button><button class="share" data-share="${r.recipeIndex}">Share</button></td></tr>`).join('');$('#listing').innerHTML=`<div class="table-wrap"><table class="table"><thead><tr><th>Recipe</th><th>Serves</th><th>Time</th><th></th></tr></thead><tbody>${body}</tbody></table></div>`;$('#pager').innerHTML=`<span>${(page-1)*perPage+1}–${Math.min(page*perPage,rows.length)} of ${rows.length} recipes</span><span><button class="pagebtn" id="prev" ${page===1?'disabled':''}>Previous</button><button class="pagebtn" id="next" ${page===max?'disabled':''}>Next</button></span>`;$('#prev').onclick=()=>{page--;showRows()};$('#next').onclick=()=>{page++;showRows()};document.querySelectorAll('.recipe-row').forEach(row=>{const openRecipe=()=>detail(recipes[Number(row.dataset.index)-1]);row.onclick=e=>{if(!e.target.closest('button'))openRecipe()};row.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&e.target===row){e.preventDefault();openRecipe()}}});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=e=>{e.stopPropagation();detail(recipes[Number(b.dataset.view)-1])});document.querySelectorAll('[data-share]').forEach(b=>b.onclick=e=>{e.stopPropagation();shareRecipe(recipes[Number(b.dataset.share)-1],b)})}
function recipeUrl(r){const u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('recipe',r.recipeIndex);return u.href}
async function shareRecipe(r){const url=recipeUrl(r);$('#shareUrl').value=url;$('#sharePanel').hidden=false;$('#copyState').textContent='Copying link…';try{await navigator.clipboard.writeText(url);$('#copyState').textContent='Link copied to clipboard. You can also select it above.'}catch{$('#copyState').textContent='Select the link above to copy it.'}$('#shareUrl').focus();$('#shareUrl').select()}
async function copyShareLink(){const input=$('#shareUrl');input.focus();input.select();try{await navigator.clipboard.writeText(input.value);$('#copyState').textContent='Link copied to clipboard.'}catch{$('#copyState').textContent='Link selected. Use your browser’s Copy command.'}}
function detail(r){const sections=[['About',r.description],['Ingredients',r.ingredients],['Method',r.directions],['Reheating',r.reheating_instructions],['Notes',r.comments]].filter(([,v])=>v&&String(v).trim());const meta=[r.servings?`Serves ${r.servings}`:'',r.preparation_time?`Prep ${r.preparation_time} min`:'',r.cook_time?`Cook ${r.cook_time} min`:'',r.rating?`Rating ${r.rating}`:''].filter(Boolean).join('　·　');const nutrition=[['Calories',r.calories],['Total fat',r.totalfat],['Saturated fat',r.satfat],['Trans fat',r.transfat],['Carbohydrates',r.carbo],['Fiber',r.fiber],['Protein',r.protein],['Sodium',r.sodium],['Sugar',r.sugar],['Cholesterol',r.cholesterol],['Iron',r.iron],['Vitamin C',r.vitaminc],['Vitamin A',r.vitamina],['Monounsaturated fat',r.monofat],['Polyunsaturated fat',r.polyfat],['Calcium',r.calcium]].filter(([,v])=>v!==''&&v!=null);const nutritionHtml=nutrition.length?`<section class="detail-section nutrition"><h3>Nutrition · as recorded</h3><dl>${nutrition.map(([name,value])=>`<div><dt>${safe(name)}</dt><dd>${safe(value)}</dd></div>`).join('')}</dl></section>`:'';const rawSource=(r.source||'').trim(),isUrl=/^https?:\/\//i.test(rawSource);let sourceLabel=rawSource?'': 'No source recorded';if(isUrl){try{let host=new URL(rawSource).hostname.replace(/^(www|m)\./i,'').toLowerCase();const names={'allrecipes.com':'Allrecipes','foodnetwork.com':'Food Network','bonappetit.com':'Bon Appétit','nytimes.com':'New York Times Cooking','marthastewart.com':'Martha Stewart','foodandwine.com':'Food & Wine','tasteofhome.com':'Taste of Home'};sourceLabel='Web · '+(names[host]||host)}catch{sourceLabel='Web'}}else if(rawSource)sourceLabel=rawSource;const sourceHtml=`<section class="detail-section"><h3>Source</h3><p class="source-credit">${safe(sourceLabel)}${isUrl?`<br><a href="${safe(rawSource)}" target="_blank" rel="noopener noreferrer">Open original recipe ↗</a>`:''}</p></section>`;const tags=String(r.tag_list||'').split(',').map(x=>x.trim()).filter(Boolean);const tagsHtml=tags.length?`<section class="detail-section"><h3>Tags</h3><ul class="tags">${tags.map(x=>`<li>${safe(x)}</li>`).join('')}</ul></section>`:'';$('#modalTitle').textContent=r.name||'Recipe';$('#modalBody').innerHTML=(meta?`<div class="detail-meta">${safe(meta)}</div>`:'')+sections.map(([title,value])=>`<section class="detail-section"><h3>${safe(title)}</h3><p>${safe(value)}</p></section>`).join('')+sourceHtml+tagsHtml+nutritionHtml;$('#modalShare').onclick=()=>shareRecipe(r);$('#overlay').classList.add('open')}
function close(){$('#overlay').classList.remove('open')}
function openSharedRecipe(){const n=Number(new URLSearchParams(location.search).get('recipe'));if(Number.isInteger(n)&&n>0&&n<=recipes.length)detail(recipes[n-1])}
$('#query').oninput=()=>{page=1;showRows()};$('#copyLink').onclick=copyShareLink;$('#shareClose').onclick=()=>$('#sharePanel').hidden=true;$('#close').onclick=close;$('#overlay').onclick=e=>{if(e.target===$('#overlay'))close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
fetch('./data.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{recipes=d.recipes.map((r,i)=>({...r,recipeIndex:i+1}));showRows();openSharedRecipe()}).catch(()=>{$('#listing').innerHTML='<div class="load-error">Could not load data.json. Open this folder through a local web server (for example, run <code>python3 -m http.server</code>).</div>'});
</script></body></html>
