:root{--blue:#244b78;--blue2:#577ba3;--ink:#1d3048;--muted:#718096;--paper:#f2f6fa;--line:#d7e1ec;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px 'DM Sans',sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer}.page{max-width:1120px;margin:0 auto;padding:48px 36px 36px}.masthead{text-align:center;padding:3px 0 26px}.fleur{display:block;width:29px;height:34px;margin:0 auto 5px;color:var(--blue2)}.masthead h1{font:600 48px/1 'Cormorant Garamond',serif;letter-spacing:.4px;color:var(--blue);margin:0}.ornament{display:flex;align-items:center;gap:12px;width:126px;margin:13px auto 0;color:var(--blue2)}.ornament:before,.ornament:after{content:'';height:1px;background:var(--blue2);opacity:.55;flex:1}.ornament span{font-size:9px}.toolbar{margin:25px auto 15px;max-width:620px}.search{position:relative}.search:before{content:'⌕';position:absolute;left:15px;top:7px;font-size:23px;color:var(--blue2)}.search input{width:100%;height:46px;padding:0 16px 0 43px;border:1px solid #c7d5e4;border-radius:4px;background:var(--white);color:var(--ink);outline:none;box-shadow:0 2px 10px #244b7808}.search input:focus{border-color:var(--blue2);box-shadow:0 0 0 3px #577ba31a}.table-wrap{background:var(--white);border:1px solid #cbd8e5;overflow:auto;box-shadow:0 8px 25px #244b7809}.table{width:100%;border-collapse:collapse;min-width:620px}.table th{text-align:left;padding:13px 20px;background:var(--blue);color:white;font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase}.table td{padding:15px 20px;border-bottom:1px solid #e8eef4;vertical-align:middle}.table tbody tr:last-child td{border-bottom:0}.table tbody tr:hover{background:#f4f8fc}.recipe-row{cursor:pointer}.recipe-row:focus{outline:2px solid var(--blue2);outline-offset:-2px}.table th:nth-child(2),.table td:nth-child(2),.table th:nth-child(3),.table td:nth-child(3){width:105px}.table th:last-child,.table td:last-child{text-align:right;min-width: }.nutrition dl div{display:flex;gap:6px;font-size:12px}.nutrition dt{color:var(--muted)}.nutrition dd{margin:0;color:var(--blue);font-weight:600}.source-credit{font-size:13px;line-height:1.65;color:#344b65}.source-credit a{color:var(--blue);text-underline-offset:3px}.tags{display:flex;flex-wrap:wrap;gap:7px;margin:0;padding:0;list-style:none}.tags li{border:1px solid #d5e0eb;padding:5px 9px;color:#46617e;font-size:11px;background:#f8fbfe}.share-panel{position:fixed;right:24px;bottom:24px;width:min(440px,calc(100vw - 32px));padding:16px;background:white;border:1px solid #b9cadc;box-shadow:0 12px 38px #10243b2b;z-index:8}.share-panel[hidden]{display:none}.share-heading{display:flex;justify-content:space-between;align-items:center;color:var(--blue);font:600 20px 'Cormorant Garamond',serif;margin-bottom:10px}.share-close{border:0;background:transparent;color:var(--blue2);font-size:19px}.share-controls{display:flex;gap:7px}.share-controls input{width:100%;min-width:0;border:1px solid #c7d5e4;padding:9px 10px;color:#53677e;font-size:11px}.copy-state{display:block;min-height:16px;margin-top:7px;color:var(--muted);font-size:11px}.detail-section{margin:0 0 22px}.detail-section:last-child{margin-bottom:0}.detail-section h3{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--blue2);margin:0 0 8px}.detail-section p{white-space:pre-wrap;line-height:1.7;margin:0;color:#344b65}.load-error{padding:35px;color:#8d3b3b;background:white;border:1px solid var(--line)}.toolbar-actions{display:flex;justify-content:center;margin:0 0 14px}.primary{border:0;background:var(--blue);color:white;padding:10px 17px;border-radius:3px;font-weight:600}.primary:hover{background:#315f91}.edit-actions{display:flex;gap:8px}.danger{border:1px solid #d9bebe;background:#fff;color:#914848;padding:8px 13px;border-radius:3px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px 15px}.nutrition-edit-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap: </style></head><body><main class="page"><header class="masthead"><svg class="fleur" viewBox="0 0 40 48" aria-hidden="true"><path d="M20 3c-2 5-7 8-7 13 0 3 2 5 5 6-6-1-12 1-12 6 0 4 4 6 9 5-3 2-4 4-4 7 0 3 3 5 7 4l2-8 2 8c4 1 7-1 7-4 0-3-1-5-4-7 5 1 9-1 9-5 0-5-6-7-12-6 3-1 5-3 5-6 0-5-5-8-7-13z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M20 21v21M13 23c-4-3-6-7-6-11m20 11c4-3 6-7 6-11" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><h1>The Recipe Box</h1><div class="ornament"><span>✦</span></div></header><div class="toolbar"><div class="search"><input id="query" type="search" placeholder="Search recipes and ingredients…" aria-label="Search recipes and ingredients"></div></div><div class="toolbar-actions"><button class="primary" id="newRecipe">＋ Add a recipe</button></div><div id="listing"><div class="empty">Loading recipes…</div></div><div class="pager" id="pager"></div></main><div class="overlay" id="overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle"></h2><span><button class="share" id="modalShare">Share</button><button class="share" id="editFromDetail">Edit</button><button class="iconbtn" id="close" aria-label="Close">×</button></span></div><div class="modal-body" id="modalBody"></div></section></div><div class="overlay" id="editorOverlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="editorTitle"><div class="modal-head"><h2 id="editorTitle">Recipe</h2><button class="iconbtn" id="editorClose" aria-label="Close">×</button></div><form class="modal-body" id="recipeForm"><div class="form-grid" id="formFields"></div><div class="form-footer"><span class="form-message" id="formMessage" role="status"></span><div class="edit-actions"><button type="button" class="danger" id="deleteRecipe" hidden>Delete</button><button type="submit" class="primary" id="saveRecipe">Save recipe</button></div></div></form></section></div><datalist id="tagSuggestions"></datalist><datalist id="sourceSuggestions"></datalist><aside class="share-panel" id="sharePanel" hidden aria-label="Recipe share link"><div class="share-heading"><span>Recipe link</span><button class="share-close" id="shareClose" aria-label="Close">×</button></div><div class="share-controls"><input id="shareUrl" readonly aria-label="Shareable recipe link"><button class="share" id="copyLink">Copy</button></div><span class="copy-state" id="copyState">Link copied to clipboard.</span></aside><script>
const $=s=>document.querySelector(s);let recipes=[],page=1,perPage=30,totalRecipes=0,currentRecipe=null,editingKey=null,listRequest=0,initialLoad=true,suggestionSources=[],suggestionTags=[],suggestionsPromise=null;const recipeCache=new Map();
const $safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fields=['id','name','comments','cook_time','directions','rating','servings','source','description','tag_list','reheating_instructions','preparation_time','ingredients','nutrition'];
const nutritionFields=[['calories','Calories'],['totalfat','Total fat'],['satfat','Saturated fat'],['transfat','Trans fat'],['carbo','Carbohydrates'],['fiber','Fiber'],['protein','Protein'],['sodium','Sodium'],['sugar','Sugar'],['cholesterol','Cholesterol'],['iron','Iron'],['vitaminc','Vitamin C'],['vitamina','Vitamin A'],['monofat','Monounsaturated fat'],['polyfat','Polyunsaturated fat'],['calcium','Calcium']];
const longFields=new Set(['comments','directions','description','reheating_instructions','ingredients','nutrition']);
const numericFields=new Set(['cook_time','rating','servings','preparation_time']);
function sourceLabel(r){const raw=(r.source||'').trim();if(!raw)return '';if(/^https?:\/\//i.test(raw)){try{const host=new URL(raw).hostname.replace(/^(www|m)\./i,'').toLowerCase(),names={'allrecipes.com':'Allrecipes','foodnetwork.com':'Food Network','bonappetit.com':'Bon Appétit','nytimes.com':'New York Times Cooking','marthastewart.com':'Martha Stewart','foodandwine.com':'Food & Wine','tasteofhome.com':'Taste of Home'};return 'Web · '+(names[host]||host)}catch{return 'Web'}}if(/^(?:uspca|uscpa|upsca) conference 2015$/i.test(raw))return 'USPCA Conference (2015)';return raw}
function recordMeta(r){const items=[],source=sourceLabel(r),tags=String(r.tag_list||'').split(',').map(x=>x.trim()).filter(Boolean);if(source)items.push(`Source: ${source}`);if(tags.length)items.push(`Tags: ${tags.join(' · ')}`);return items.join('　|　')}
async function loadRecipes(){const request=++listRequest,query=$('#query').value.trim(),params=new URLSearchParams({limit:String(perPage),offset:String((page-1)*perPage)});if(query)params.set('q',query);const response=await fetch(`./api/recipes?${params}`);if(!response.ok)throw Error((await response.json().catch(()=>({}))).error||'Could not load the recipe database.');const data=await response.json();if(request!==listRequest)return;recipes=data.recipes||[];totalRecipes=Number(data.total)||0;showRows();if(initialLoad){initialLoad=false;openSharedRecipe()}}
function refreshSuggestions(){$('#tagSuggestions').innerHTML=suggestionTags.map(x=>`<option value="${$safe(x)}">`).join('');$('#sourceSuggestions').innerHTML=suggestionSources.map(x=>`<option value="${$safe(x)}">`).join('')}
async function loadSuggestions(){if(!suggestionsPromise)suggestionsPromise=fetch('./api/recipes/suggestions').then(async response=>{if(!response.ok)throw Error('Could not load tag and source suggestions.');const data=await response.json();suggestionTags=data.tags||[];suggestionSources=data.sources||[];refreshSuggestions()}).catch(error=>{suggestionsPromise=null;throw error});return suggestionsPromise}
function showRows(){const max=Math.max(1,Math.ceil(totalRecipes/perPage));page=Math.min(page,max);if(!recipes.length){$('#listing').innerHTML=totalRecipes?'<div class="empty">Loading recipes…</div>':'<div class="empty">No recipes found. Try another search.</div>';$('#pager').innerHTML='';return}const body=recipes.map(r=>`<tr class="recipe-row" data-key="${$safe(r.recipe_key||r.key)}" tabindex="0"><td><div class="name">${$safe(r.name||'Untitled recipe')}</div><span class="sub">${$safe((r.preview||'').replace(/\s+/g,' '))}</span>${recordMeta(r)?`<span class="sub record-meta">${$safe(recordMeta(r))}</span>`:''}</td><td class="data">${r.servings?$safe(r.servings):'—'}</td><td class="data">${r.preparation_time||r.cook_time?$safe(r.preparation_time||r.cook_time)+' min':'—'}</td><td><button class="open" data-view="${$safe(r.recipe_key||r.key)}">View</button><button class="share" data-share="${$safe(r.recipe_key||r.key)}">Share</button></td></tr>`).join('');$('#listing').innerHTML=`<div class="table-wrap"><table class="table"><thead><tr><th>Recipe</th><th>Serves</th><th>Time</th><th></th></tr></thead><tbody>${body}</tbody></table></div>`;const first=(page-1)*perPage+1,last=Math.min(page*perPage,totalRecipes);$('#pager').innerHTML=`<span>${first}–${last} of ${totalRecipes} recipes</span><span><button class="pagebtn" id="prev" ${page===1?'disabled':''}>Previous</button><button class="pagebtn" id="next" ${page===max?'disabled':''}>Next</button></span>`;$('#prev').onclick=()=>{page--;loadRecipes().catch(showLoadError)};$('#next').onclick=()=>{page++;loadRecipes().catch(showLoadError)};document.querySelectorAll('.recipe-row').forEach(row=>{row.onclick=e=>{if(!e.target.closest('button'))detailByKey(row.dataset.key)};row.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&e.target===row){e.preventDefault();detailByKey(row.dataset.key)}}});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=e=>{e.stopPropagation();detailByKey(b.dataset.view)});document.querySelectorAll('[data-share]').forEach(b=>b.onclick=e=>{e.stopPropagation();shareRecipe({key:b.dataset.share})})}
function showLoadError(error){$('#listing').innerHTML=`<div class="load-error">${$safe(error.message)}</div>`}
async function detailByKey(key){if(recipeCache.has(key)){detail(recipeCache.get(key));return}$('#modalTitle').textContent='Loading recipe…';$('#modalBody').innerHTML='<p class="source-credit">Fetching recipe details…</p>';$('#overlay').classList.add('open');try{const response=await fetch(`./api/recipes/${encodeURIComponent(key)}`);const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error||'Could not load this recipe.');recipeCache.set(key,data.recipe);detail(data.recipe)}catch(error){$('#modalTitle').textContent='Could not load recipe';$('#modalBody').textContent=error.message}}
function recipeUrl(r){const u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('recipe',r.key);return u.href}
async function shareRecipe(r){if(!r)return;const url=recipeUrl(r);$('#shareUrl').value=url;$('#sharePanel').hidden=false;$('#copyState').textContent='Copying link…';try{await navigator.clipboard.writeText(url);$('#copyState').textContent='Link copied to clipboard. You can also select it above.'}catch{$('#copyState').textContent='Select the link above to copy it.'}$('#shareUrl').focus();$('#shareUrl').select()}
async function copyShareLink(){const input=$('#shareUrl');input.focus();input.select();try{await navigator.clipboard.writeText(input.value);$('#copyState').textContent='Link copied to clipboard.'}catch{$('#copyState').textContent='Link selected. Use your browser’s Copy command.'}}
function detail(r){if(!r)return;currentRecipe=r;const sections=[['About',r.description],['Ingredients',r.ingredients],['Method',r.directions],['Reheating',r.reheating_instructions],['Notes',r.comments]].filter(([,v])=>v&&String(v).trim());const meta=[r.servings?`Serves ${r.servings}`:'',r.preparation_time?`Prep ${r.preparation_time} min`:'',r.cook_time?`Cook ${r.cook_time} min`:'',r.rating?`Rating ${r.rating}`:''].filter(Boolean).join('　·　');const nutrition=nutritionFields.map(([key,label])=>[label,r.nutrition?.[key]]).filter(([,value])=>value!==''&&value!=null);const nutritionHtml=nutrition.length?`<section class="detail-section nutrition"><h3>Nutrition · as recorded</h3><dl>${nutrition.map(([name,value])=>`<div><dt>${$safe(name)}</dt><dd>${$safe(value)}</dd></div>`).join('')}</dl></section>`:'';const rawSource=(r.source||'').trim(),isUrl=/^https?:\/\//i.test(rawSource);let label=rawSource?'':'No source recorded';if(isUrl){try{label='Web · '+new URL(rawSource).hostname.replace(/^(www|m)\./i,'')}catch{label='Web'}}const sourceHtml=`<section class="detail-section"><h3>Source</h3><p class="source-credit">${$safe(label)}${isUrl?`<br><a href="${$safe(rawSource)}" target="_blank" rel="noopener noreferrer">Open original recipe ↗</a>`:''}</p></section>`;const tags=String(r.tag_list||'').split(',').map(x=>x.trim()).filter(Boolean),tagsHtml=tags.length?`<section class="detail-section"><h3>Tags</h3><ul class="tags">${tags.map(x=>`<li>${$safe(x)}</li>`).join('')}</ul></section>`:'';$('#modalTitle').textContent=r.name||'Recipe';$('#modalBody').innerHTML=(meta?`<div class="detail-meta">${$safe(meta)}</div>`:'')+sections.map(([title,value])=>`<section class="detail-section"><h3>${$safe(title)}</h3><p>${$safe(value)}</p></section>`).join('')+sourceHtml+tagsHtml+nutritionHtml;$('#modalShare').onclick=()=>shareRecipe(r);$('#editFromDetail').onclick=()=>openEditor(r);$('#overlay').classList.add('open')}
async function apiWrite(url,method,payload){const response=await fetch(url,{method,headers:{'content-type':'application/json'},body:payload===undefined?undefined:JSON.stringify(payload)});const data=response.status===204?null:await response.json().catch(()=>null);if(!response.ok)throw Error(data?.error||'Could not save changes.');return data}
function openEditor(recipe=null){loadSuggestions().catch(()=>{});editingKey=recipe?.key||null;$('#editorTitle').textContent=recipe?'Edit recipe':'Add a recipe';$('#formMessage').textContent='';$('#deleteRecipe').hidden=!recipe;$('#formFields').innerHTML=fields.map(key=>{if(key==='nutrition')return `<fieldset class="field wide" style="border:0;padding:0;margin:0"><legend class="field label" style="margin-bottom:7px">Nutrition facts</legend><div class="nutrition-edit-grid">${nutritionFields.map(([name,label])=>`<div class="field"><label for="field-nutrition-${name}">${$safe(label)}</label><input id="field-nutrition-${name}" name="nutrition.${name}" value="${$safe(recipe?.nutrition?.[name]??'')}" inputmode="decimal"></div>`).join('')}</div></fieldset>`;const wide=longFields.has(key)||key==='source';const label=key.replaceAll('_',' ');const list=key==='source'?'sourceSuggestions':key==='tag_list'?'tagSuggestions':'';const value=recipe?.[key]??'';return `<div class="field ${wide?'wide':''}"><label for="field-${key}">${$safe(label)}</label>${longFields.has(key)?`<textarea id="field-${key}" name="${key}" ${list?`list="${list}"`:''}>${$safe(value)}</textarea>`:`<input id="field-${key}" name="${key}" type="text" ${list?`list="${list}"`:''} value="${$safe(value)}" autocomplete="off">`}</div>`}).join('');$('#overlay').classList.remove('open');$('#editorOverlay').classList.add('open');$('#formFields input, #formFields textarea')[1]?.focus()}
function closeEditor(){$('#editorOverlay').classList.remove('open')}
$('#recipeForm').onsubmit=async e=>{e.preventDefault();$('#formMessage').textContent='Saving…';$('#saveRecipe').disabled=true;const formData=new FormData(e.currentTarget),payload={};for(const key of fields)payload[key]=key==='nutrition'?Object.fromEntries(nutritionFields.map(([name])=>[name,formData.get(`nutrition.${name}`)||''])):formData.get(key)||'';try{const data=await apiWrite(editingKey?`./api/recipes/${encodeURIComponent(editingKey)}`:'./api/recipes',editingKey?'PUT':'POST',payload);if(editingKey){recipeCache.set(editingKey,data.recipe);const i=recipes.findIndex(r=>(r.recipe_key||r.key)===editingKey);if(i>=0)Object.assign(recipes[i],{...data.recipe,recipe_key:editingKey,preview:(data.recipe.description||data.recipe.ingredients||'').slice(0,320)});}else{recipeCache.set(data.key,data.recipe);recipes.unshift({recipe_key:data.key,...data.recipe,preview:(data.recipe.description||data.recipe.ingredients||'').slice(0,320)});totalRecipes++;}const savedRecipe=data.recipe;suggestionTags=[...new Set([...suggestionTags,...String(savedRecipe.tag_list||'').split(',').map(x=>x.trim()).filter(Boolean)])].sort((a,b)=>a.localeCompare(b));if(savedRecipe.source)suggestionSources=[...new Set([...suggestionSources,savedRecipe.source])].sort((a,b)=>a.localeCompare(b));refreshSuggestions();page=1;loadRecipes().catch(showLoadError);closeEditor();if(currentRecipe&&currentRecipe.key===editingKey)detail(recipeCache.get(editingKey))}catch(err){$('#formMessage').textContent=err.message}finally{$('#saveRecipe').disabled=false}};
$('#deleteRecipe').onclick=async()=>{if(!editingKey||!confirm('Delete this recipe permanently?'))return;$('#formMessage').textContent='Deleting…';try{await apiWrite(`./api/recipes/${encodeURIComponent(editingKey)}`,'DELETE');recipeCache.delete(editingKey);recipes=recipes.filter(r=>(r.recipe_key||r.key)!==editingKey);totalRecipes=Math.max(0,totalRecipes-1);page=1;loadRecipes().catch(showLoadError);closeEditor();close()}catch(err){$('#formMessage').textContent=err.message}};
function close(){$('#overlay').classList.remove('open')}
