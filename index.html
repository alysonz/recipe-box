<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1">
		<title>
			The Recipe Box
		</title>
		<link rel="stylesheet" href="./styles.css">
	</head>
	<body>
		<main class="page">
			<header class="masthead">
				<svg class="fleur" viewBox="0 0 40 48" aria-hidden="true">
					<path d="M20 3c-2 5-7 8-7 13 0 3 2 5 5 6-6-1-12 1-12 6 0 4 4 6 9 5-3 2-4 4-4 7 0 3 3 5 7 4l2-8 2 8c4 1 7-1 7-4 0-3-1-5-4-7 5 1 9-1 9-5 0-5-6-7-12-6 3-1 5-3 5-6 0-5-5-8-7-13z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
					<path d="M20 21v21M13 23c-4-3-6-7-6-11m20 11c4-3 6-7 6-11" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
				</svg>
				<h1>
					The Recipe Box
				</h1>
				<div class="ornament">
					<span>
						✦
					</span>
				</div>
			</header>
			<div class="toolbar">
				<div class="search">
					<input id="query" type="search" placeholder="Search recipes and ingredients…" aria-label="Search recipes and ingredients">
				</div>
			</div>
			<div class="toolbar-actions">
				<button class="primary" id="newRecipe">
					＋ Add a recipe
				</button>
			</div>
			<div id="listing">
				<div class="empty">
					Loading recipes…
				</div>
			</div>
			<div class="pager" id="pager">
			</div>
		</main>
		<div class="overlay" id="overlay">
			<section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
				<div class="modal-head">
					<h2 id="modalTitle">
					</h2>
					<span>
						<button class="share" id="modalShare">
							Share
						</button>
						<button class="share" id="editFromDetail">
							Edit
						</button>
						<button class="iconbtn" id="close" aria-label="Close">
							×
						</button>
					</span>
				</div>
				<div class="modal-body" id="modalBody">
				</div>
			</section>
		</div>
		<div class="overlay" id="editorOverlay">
			<section class="modal" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
				<div class="modal-head">
					<h2 id="editorTitle">
						Recipe
					</h2>
					<button class="iconbtn" id="editorClose" aria-label="Close">
						×
					</button>
				</div>
				<form class="modal-body" id="recipeForm">
					<div class="form-grid" id="formFields">
					</div>
					<div class="form-footer">
						<span class="form-message" id="formMessage" role="status">
						</span>
						<div class="edit-actions">
							<button type="button" class="danger" id="deleteRecipe" hidden>
								Delete
							</button>
							<button type="submit" class="primary" id="saveRecipe">
								Save recipe
							</button>
						</div>
					</div>
				</form>
			</section>
		</div>
		<datalist id="tagSuggestions">
		</datalist>
		<datalist id="sourceSuggestions">
		</datalist>
		<aside class="share-panel" id="sharePanel" hidden aria-label="Recipe share link">
			<div class="share-heading">
				<span>
					Recipe link
				</span>
				<button class="share-close" id="shareClose" aria-label="Close">
					×
				</button>
			</div>
			<div class="share-controls">
				<input id="shareUrl" readonly aria-label="Shareable recipe link">
				<button class="share" id="copyLink">
					Copy
				</button>
			</div>
			<span class="copy-state" id="copyState">
				Link copied to clipboard.
			</span>
		</aside>
		<script src="./app.js"></script>
	</body>
</html>
